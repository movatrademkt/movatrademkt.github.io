<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html lang="pt-br" xml:lang="pt-br">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Black Friday da Saúde</title>
  <style type="text/css">
    body {
      margin:0 !important;
      padding:0 !important;
      background-color:#ffffff;
      -webkit-text-size-adjust:100%;
      -ms-text-size-adjust:100%;
    }
    table { border-collapse:collapse !important; }
    img {
      border:0;
      outline:none;
      text-decoration:none;
      display:block;
      height:auto;
      line-height:100%;
    }
    @media screen and (max-width:600px) {
      .full-width { width:100% !important; max-width:600px !important; }
      .fluid-img { width:100% !important; height:auto !important; }
    }
  </style>
</head>

<body>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#FFFFFF">
    <tr>
      <td align="center" valign="top">

        <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" align="center" class="full-width">
          <tr>
            <td align="center" valign="top">
              <custom type="header"/>
            </td>
          </tr>

          <tr>
            <td align="center" valign="top" style="font-size:0; line-height:0;">
              <img src="https://movatrademkt.github.io/assets_emailmkt_blackfriday_ceape/01-topo.jpg" width="600" alt="" border="0" class="fluid-img" style="width:600px; max-width:600px; height:auto;">
            </td>
          </tr>

          <tr>
            <td align="center" valign="top" style="font-size:0; line-height:0;">
              <img src="https://movatrademkt.github.io/assets_emailmkt_blackfriday_ceape/02-conteudo.jpg" width="600" alt="" border="0" class="fluid-img" style="width:600px; max-width:600px; height:auto;">
            </td>
          </tr>

          <tr>
            <td align="center" valign="top" style="font-size:0; line-height:0;">
              <img src="https://movatrademkt.github.io/assets_emailmkt_blackfriday_ceape/03-conteudo.jpg" width="600" alt="" border="0" class="fluid-img" style="width:600px; max-width:600px; height:auto;">
            </td>
          </tr>

          <tr>
            <td align="center" valign="top" style="font-size:0; line-height:0;">
              <img src="https://movatrademkt.github.io/assets_emailmkt_blackfriday_ceape/04-rodape.jpg" width="600" alt="" border="0" class="fluid-img" style="width:600px; max-width:600px; height:auto;">
            </td>
          </tr>

          <tr>
            <td align="center" valign="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:16px;color:#000000;padding:16px 10px 20px 10px;">
              Caso não queira mais receber este e-mail,
              <a href="%%unsub_center_url%%" target="_blank" style="color:#000000;text-decoration:underline;">acesse aqui</a>.
            </td>
          </tr>

          <tr>
            <td align="center" valign="top">
              <custom name="opencounter" type="tracking"/>
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
</body>
</html>
